<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f4f1eb">
  <title>光路校准台 · 暗箱</title>
  <link rel="icon" type="image/svg+xml" href="./aperture.svg">
  <link rel="stylesheet" href="./assets/calibration.css">
</head>
<body class="cal-page">
  <header class="topbar"><div class="top-inner">
    <a href="./" class="brand cal-brand" aria-label="暗箱取景台">
      <span class="brand-mark"><img src="./aperture.svg" alt=""></span><b>暗箱</b><em>Obscura</em>
    </a>
    <a class="cal-return" href="./">← 返回取景台</a>
  </div></header>
  <main>
    <div class="workspace-title"><div><span class="kicker">OPTICAL CALIBRATION</span><h1>光路校准台</h1></div></div>
    <div class="cal-layout">
      <figure class="cal-plot">
        <figcaption><h2>光路侧视</h2><small>150 mm · 4×5</small></figcaption>
        <canvas aria-label="镜头、感光面与物方焦平面的侧视几何示意">光路侧视图</canvas>
        <div class="cal-legend"><span><i class="lens"></i>镜头平面</span><span><i class="film"></i>感光面</span><span><i class="focus"></i>物方焦平面</span><span><i class="pupil-rays"></i>孔径光线</span></div>
      </figure>
      <section class="cal-controls" aria-label="校准旋钮">
        <h2>机构调节</h2>
        <div class="cal-dials" id="cal-dials"></div>
        <div class="cal-instruction">点刻度快速定位，左右拖动滚轮调节。精调档每格调节 0.01 mm 或 0.01°。</div>
      </section>
    </div>
    <section class="cal-readout" aria-labelledby="cal-read-label">
      <div><h2 id="cal-read-label">光轴清晰物距</h2><output id="cal-read" aria-live="polite"></output></div>
      <p id="cal-status"></p>
    </section>
  </main>
  <script type="module" src="./assets/calibration.js"></script>
</body>
</html>
